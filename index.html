['탑','예상 밖의 변화','흔들리는 구조를 다시 점검하고 더 단단한 기반을 세울 때입니다.','필요한 변화를 외면하기보다 안전한 대안을 마련해 보세요.'],
['별','희망과 회복','작지만 분명한 희망을 붙잡고 긴 호흡으로 회복을 이어가세요.','기대만으로 해결되지는 않습니다. 희망을 작은 행동으로 이어가세요.'],
['달','불확실성과 감정','모든 것이 선명하지는 않습니다. 충분히 확인한 뒤 판단하세요.','걱정이나 오해가 사실처럼 느껴지지 않는지 구분해 보세요.'],
['태양','활력과 기쁨','좋은 에너지를 나누고 자신 있게 장점을 펼쳐 보세요.','긍정적인 기대 속에서도 세부 사항을 놓치지 마세요.'],

const suits=[['지팡이','wa','열정과 행동','🔥'],['컵','cu','감정과 관계','💧'],['검','sw','생각과 선택','⚔️'],['펜타클','pe','현실과 자원','✦']];

const patterns=[['새로운 가능성','작은 시작을 실천으로 옮겨 보세요.','성급한 출발을 경계하고 기초를 다져 보세요.'],['균형과 선택','서로 다른 요구 사이에서 우선순위를 찾아보세요.','결정을 미루거나 한쪽에 치우치지 않았는지 점검하세요.'],['협력과 확장','혼자보다 함께할 때 더 많은 것을 배울 수 있습니다.','계획과 협업에 빈틈이 없는지 확인하세요.'],['안정과 휴식','성과를 지키면서 필요한 휴식도 누려 보세요.','안주하거나 지나치게 움켜쥐고 있지는 않은지 돌아보세요.'],['갈등과 조정','의견 차이 속에서도 배울 점을 찾아보세요.','불필요한 경쟁과 소모적인 다툼을 줄이세요.'],['회복과 나눔','주고받는 도움과 성취를 기쁘게 받아들이세요.','인정받고 싶은 마음이 판단을 흔들지는 않는지 살펴보세요.'],['도전과 방어','중요한 가치를 지키되 유연성을 잃지 마세요.','지나친 방어심이나 피로감에 주의하세요.'],['속도와 진전','기회가 생기면 준비한 것을 차근차근 실행하세요.','급한 결정보다 사실 확인을 먼저 하세요.'],['인내와 성숙','지금까지 쌓아온 힘을 믿고 한 걸음 더 나아가세요.','걱정을 혼자 짊어지지 말고 필요한 도움을 구하세요.'],['마무리와 책임','끝맺음과 책임 분담을 분명하게 해 보세요.','지나친 부담은 덜어내고 우선순위를 재정리하세요.'],['호기심과 소식','새로운 소식이나 배움의 기회를 열린 마음으로 받아들이세요.','설렘만으로 판단하지 말고 내용을 확인하세요.'],['도전과 움직임','목표를 향해 에너지를 실어 나아갈 때입니다.','성급하거나 충동적인 행동을 점검하세요.'],['돌봄과 자신감','자신의 강점을 따뜻하고 성숙하게 발휘해 보세요.','타인을 챙기느라 자신의 필요를 잊지 마세요.'],['책임과 리더십','넓게 보고 책임감 있게 방향을 이끌어 보세요.','권위와 고집 대신 대화와 균형을 선택하세요.']];

function scrollToReading(){

function pick(btn,index){

 '새로운 사람에게 호기심이 생기거나 관계를 새롭게 시작하고 싶은 마음이 나타날 수 있어요. 설렘을 즐기되 서로 알아갈 시간을 충분히 주세요.','마음을 표현할 기회가 있어 보여요. 상대의 반응을 조종하려 하기보다는 나의 감정을 솔직하고 분명하게 전하세요.','상대의 말보다 분위기를 읽으려다 혼란스러울 수 있어요. 속마음을 추측하지 말고 필요한 것은 부드럽게 물어보세요.','다정함과 애정 표현이 관계를 키우는 힘이 돼요. 다만 늘 한 사람만 돌보고 있다면 균형도 살펴보세요.','연애에서 약속과 책임이 중요한 카드예요. 안정감을 주는 규칙이 도움이 되지만 지나친 간섭은 갈등을 부를 수 있어요.','두 사람의 연애관과 관계에 대한 기대가 맞는지 이야기해 보세요. 남들이 말하는 이상적인 연애가 정답은 아니에요.','마음이 끌리는 것과 실제로 함께할 수 있는지는 다른 문제예요. 두 사람의 가치관과 선택을 함께 생각하세요.','관계가 빠르게 진전되거나 주도권을 잡고 싶은 마음이 나타날 수 있어요. 상대의 속도와 의사도 존중하세요.','서운함이 있어도 다정하면서 단호하게 말하는 것이 중요해요. 감정을 참기만 하거나 폭발시키지 마세요.','연애에서 자신에게 필요한 시간과 거리를 확인할 때예요. 혼자 있는 시간이 꼭 마음이 식었다는 뜻은 아니에요.','연락이나 만남의 흐름이 달라질 수 있어요. 작은 변화마다 의미를 단정하기보다 실제 행동을 지켜보세요.','말과 행동의 일치, 서로에게 공정한 배려가 중요한 시기예요. 일방적으로 희생하는 관계는 아닌지 살펴보세요.','연애가 뜻대로 움직이지 않을 때는 상대를 바꾸려 하기보다 관점을 달리해 보세요. 기다림에도 서로 동의한 기준이 필요해요.','관계의 오래된 방식이 끝나거나 감정이 달라질 수 있어요. 헤어짐을 단정하기보다는 무엇을 바꿔야 하는지 대화해 보세요.','서로 다른 성격이나 생활 리듬을 조율할 필요가 있어요. 한 번의 큰 화해보다 작은 약속을 지키는 것이 중요해요.','외로움이나 불안 때문에 관계를 놓지 못하는지 살펴보세요. 강한 끌림과 건강한 관계는 같은 뜻이 아니에요.','예상치 못한 다툼이나 숨겨둔 문제가 드러날 수 있어요. 감정이 격할 때 중요한 결론부터 내리지 마세요.','관계에 대한 희망을 천천히 회복하는 카드예요. 상처가 있었다면 서두르지 말고 안전한 신뢰부터 쌓아보세요.','상대의 반응이 애매하게 느껴질 수 있어요. 상상 속 최악의 결론 대신 직접 확인할 수 있는 질문을 해보세요.','따뜻하고 솔직한 교류가 관계에 힘을 줄 수 있어요. 고마운 점을 표현하고 함께 즐거운 시간을 만들어 보세요.','과거 연애의 패턴이나 중요한 대화를 다시 돌아볼 수 있어요. 같은 갈등을 반복하지 않도록 배운 점을 나눠보세요.','서로 노력해 온 관계가 안정된 단계로 향할 수 있어요. 다음 단계에 대한 기대가 같은지 함께 확인하세요.'],
 money:[
 '새로운 소비나 수입 아이디어에 마음이 끌릴 수 있어요. 바로 결제하거나 투자하기보다 필요한 비용과 위험부터 계산해 보세요.','이미 가진 기술과 자원을 활용할 여지가 있어요. 돈을 늘리는 생각보다 실제 가능한 계획과 실행 비용을 따져보세요.','금전 제안에 빠진 정보가 없는지 살펴볼 때예요. 느낌이 좋다는 이유만으로 계약하거나 송금하지 마세요.','생활의 안정과 필요한 소비에 관심이 커질 수 있어요. 자신을 돌보는 지출과 충동적인 지출을 구분해 보세요.','예산과 고정비를 체계적으로 관리할 필요가 있어요. 통제하기 어려운 변수보다 관리 가능한 지출부터 정하세요.','주변의 금융 조언을 들을 때 출처와 조건을 확인하세요. 남에게 맞는 방법이 내 소득과 위험 수준에도 맞는 것은 아니에요.','두 가지 소비나 재정 계획 중 선택이 필요할 수 있어요. 감정적인 끌림보다 우선순위와 감당 가능성을 비교하세요.','재정 목표를 향해 계획적으로 움직이는 카드예요. 빨리 성과를 내고 싶어도 무리한 대출이나 지출을 경계하세요.','돈이 걱정돼도 작은 관리 습관을 지속하는 힘이 중요해요. 단기 성과보다 지킬 수 있는 규칙을 만드세요.','큰 결정을 하기 전 혼자 숫자를 점검할 시간이 필요해요. 지출 내역과 계약 조건을 차분히 검토하세요.','수입과 지출에 예상 밖의 변동이 생길 수 있어요. 미래를 확신하기보다 비상 여유와 대안을 준비하세요.','빌려주고 빌리는 돈, 공동 지출에서 공정한 기준이 필요해요. 약속은 금액과 기한을 분명하게 남겨두세요.','돈을 쓰거나 불릴 계획을 잠시 보류하고 다시 살펴볼 만해요. 기다리는 동안 더 나은 정보가 생길 수 있어요.','필요 없는 구독이나 오래된 지출 습관을 정리하는 카드예요. 쓰지 않는 것부터 줄여 새로운 여유를 만들어 보세요.','지출·저축·생활 만족 사이의 균형이 중요해요. 지나친 절약도 무계획한 소비도 오래 지속하기 어려워요.','할인, 보상, 즉각적인 만족에 끌리는 상황을 경계하세요. 지금의 즐거움이 다음 달 부담이 되지 않는지 확인하세요.','예상 못 한 비용을 대비할 필요가 있어요. 불안해하기보다 필수 지출과 보유 자원을 먼저 점검하세요.','재정에 대한 희망을 되찾아갈 수 있어요. 막연한 큰돈보다 작은 저축 목표와 실천이 도움이 돼요.','돈과 관련된 소문이나 애매한 수익 약속에 주의하세요. 문서로 확인되지 않은 내용은 판단 근거로 삼지 마세요.','재정 상황에서 만족할 만한 작은 성과를 돌아볼 수 있어요. 기쁨을 누리되 다음 달 예산도 함께 챙기세요.','그동안의 소비 선택에서 배운 점을 살릴 수 있어요. 잘못된 지출을 탓하기보다 반복을 막는 장치를 마련하세요.','오래 세운 재정 계획을 정리하고 다음 목표를 만들 때예요. 현재 자산과 지출 구조를 함께 점검하세요.'],
 work:[
